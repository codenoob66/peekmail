name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📂 Sync files
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server: ssh.ca903dsng.service.one
          port: 22
          local_path: './'
          remote_path: '/webroots/55e0a18c/'
          sftp_args: '-o ConnectTimeout=5'
          exclude: |
            .git*
            .github
            credentials.json
            token.json
            users.db
            README.md
            vendor
